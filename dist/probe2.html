<body style="margin:0">
<script>
localStorage.setItem('wallet_token','demo-token');
localStorage.setItem('wallet_user',JSON.stringify({id:1,name:'Ada Okeke',email:'ada@example.com'}));
</script>
<iframe id="f" src="/?tab=history" style="width:390px;height:1400px;border:0"></iframe>
<pre id="out">pending</pre>
<script>
document.getElementById('f').onload = () => setTimeout(() => {
  const d = document.getElementById('f').contentDocument, de = d.documentElement;
  let over = [];
  d.querySelectorAll('*').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.right > 391.5) over.push((el.className||el.tagName) + ' -> ' + Math.round(r.right));
  });
  document.getElementById('out').textContent = 'scrollWidth=' + de.scrollWidth + ' client=' + de.clientWidth + '\n' + over.slice(0,10).join('\n');
}, 2500);
</script>
</body>
