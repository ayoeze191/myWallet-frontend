<body style="margin:0">
<iframe id="f" src="/" style="width:390px;height:1400px;border:0"></iframe>
<pre id="out">pending</pre>
<script>
document.getElementById('f').onload = () => setTimeout(() => {
  const d = document.getElementById('f').contentDocument;
  const de = d.documentElement;
  let widest = [];
  d.querySelectorAll('*').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.right > 391.5) widest.push(el.className + ' -> ' + Math.round(r.right));
  });
  document.getElementById('out').textContent =
    'scrollWidth=' + de.scrollWidth + ' client=' + de.clientWidth + '\n' + widest.slice(0,12).join('\n');
}, 1500);
</script>
</body>
